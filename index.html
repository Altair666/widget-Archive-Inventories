function editableRow(r) {
  var frag = document.createDocumentFragment();

  // № — формульная колонка Grist, здесь только превью того, что она посчитает.
  var origYear = dateToYear(r.IssueDate);
  var numValue = r.Number != null ? r.Number : null;
  var tdNum = document.createElement('td');
  var numEl = document.createElement('div');
  numEl.className = 'form-input mono formed-num';
  tdNum.appendChild(numEl);
  frag.appendChild(tdNum);
  function recalcNumber() {
    var y = inDate.value ? parseInt(inDate.value.slice(0, 4), 10) : null;
    numValue = (y === origYear && r.Number != null) ? r.Number : computeNextNumber(y, r.id);
    numEl.textContent = numValue != null ? numValue : '—';
  }

  var tdDate = document.createElement('td');
  var inDate = document.createElement('input');
  inDate.className = 'form-input mono'; inDate.type = 'date';
  inDate.value = dateToInputValue(r.IssueDate);
  inDate.addEventListener('change', recalcNumber);
  tdDate.appendChild(inDate);
  frag.appendChild(tdDate);
  recalcNumber();

  var tdDest = document.createElement('td');
  tdDest.className = 'reg-dest';
  // «Куда» при редактировании не меняется — только показываем.
  tdDest.textContent = r.Destination || '';
  var raw = state.rawById[r.id] || { order: 0, products: [], notices: [], documents: [] };
  var cascade = createCascade({ small: true, recordId: r.id, firm: r.Destination || '', initial: raw,
    asOf: r.IssueDate != null ? r.IssueDate : null });
  inDate.addEventListener('change', function () { cascade.setAsOf(inputValueToDate(inDate.value)); });
  frag.appendChild(tdDest);

  [cascade.productsEl, cascade.dnEl, cascade.orderEl, cascade.noticesEl, cascade.docsEl].forEach(function (el) {
    var td = document.createElement('td');
    td.className = 'reg-left';
    td.appendChild(el);
    frag.appendChild(td);
  });

  var saveBtn = iconButton('cell-edit-btn save', checkSvg(), 'Сохранить');
  saveBtn.addEventListener('click', function () {
    var c = cascade.getValue();
    var fields = { IssueDate: inputValueToDate(inDate.value) };
    // Заказ/изделия/документы не трогали — пишем только дату: у старых описей
    // не затираем извещения и документы.
    if (c.dirty) {
      if (c.order && (!c.products.length || !c.documents.length)) {
        window.alert('Выберите изделие и хотя бы один документ (или очистите заказ).');
        return;
      }
      if (c.blockers.length) {
        window.alert('Нужно извещение на документы:\n' + c.blockers.join('\n'));
        return;
      }
      fields.Order = c.order || 0;
      if (c.order) {
        fields.Products = ['L'].concat(c.products);
        fields.Notices = ['L'].concat(c.notices);
        fields.Documents = ['L'].concat(c.documents);
      }
    }
    saveBtn.disabled = true;
    grist.selectedTable.update({ id: r.id, fields: fields }).then(function () {
      state.editingId = null;
      renderRegistry();
    }).catch(function (err) { saveBtn.disabled = false; showError(err); });
  });
  var cancelBtn = iconButton('cell-edit-btn cancel', xSvg(), 'Отмена');
  cancelBtn.addEventListener('click', function () { state.editingId = null; renderRegistry(); });
  frag.appendChild(actionCell([saveBtn, cancelBtn]));

  return frag;
}

// Что показывать в строке реестра: id берём из rawById (числовые, через
// fetchTable), текст — из справочников; пока справочники не загрузились,
// падаем на текст displayCol, который прислал onRecords.
function recordView(r) {
  var raw = state.rawById[r.id];
  var order = raw ? state.ordersById[raw.order] : null;
  var comps = raw ? raw.products.map(function (id) { return state.componentsById[id]; }).filter(Boolean) : [];
  var notices = raw ? raw.notices.map(function (id) {
    return state.noticesById[id] || { id: id, number: '#' + id };
  }) : [];
  var docs = raw ? raw.documents.map(function (id) {
    return state.docsById[id] || { id: id, des: '#' + id, inv: '', sheets: null, version: null, name: '' };
  }) : [];
  return {
    docs: docs,
    order: order,
    orderText: order ? (order.contract || ('заказ #' + order.id)) : (typeof r.Order === 'string' ? r.Order : ''),
    productText: comps.length ? comps.map(function (c) { return c.name; }).join('\n') : '',
    dnText: comps.length ? comps.map(function (c) { return c.dn; }).join('\n') : (r.DecimalNumber || ''),
    notices: notices
  };
}

// ---------- PDF описи (бланки opis_copies_* / opis_edocs_*) ----------
//
// Шаблоны, opis_layout.json и шрифты лежат в корне репозитория рядом с
// index.html — пути относительные, как в notification_numbers.
// paginate()/buildOpisPart() перенесены из эталона example_fill_pdf-lib.js:
// строк столько, сколько данных; «Составил/Получил» сразу под таблицей;
// не влезло — продолжение на листе 1a «Опись № … Лист N».
// Одна опись — один PDF: сначала опись копий (извещения), затем опись
// электронных документов (купленные документы). Каждая часть — со своей
// нумерацией листов и своими подписями, как на скане «Опись 13-2025.pdf».
var OPIS_ASSETS = ['opis_layout.json', 'times-cp1251.ttf', 'timesbd-cp1251.ttf',
  'opis_copies_1.pdf', 'opis_copies_1a.pdf', 'opis_edocs_1.pdf', 'opis_edocs_1a.pdf'];
var opisAssetsPromise = null;

function loadOpisAssets() {
  if (!opisAssetsPromise) {
    opisAssetsPromise = Promise.all(OPIS_ASSETS.map(function (f) {
      return fetch(f).then(function (r) {
        if (!r.ok) throw new Error('Не удалось загрузить ' + f + ' (' + r.status + ')');
        return f.slice(-5) === '.json' ? r.json() : r.arrayBuffer();
      });
    })).then(function (parts) {
      var a = {};
      OPIS_ASSETS.forEach(function (f, i) { a[f] = parts[i]; });
      return a;
    });
    opisAssetsPromise.catch(function () { opisAssetsPromise = null; });
  }
  return opisAssetsPromise;
}

// Раскладка строк по листам. Последний лист должен вместить подписи; иначе хвост уезжает на новый лист.
// Строка-группа (название изделия) не остаётся последней на листе — уходит вместе со своими документами.
// Строка-группа (изделие) — L.row; строка документа — lay.docRow (в описи эл. документов двухстрочная).
function opisRowHeight(L, lay, row) { return row.group ? L.row : (lay.docRow || L.row); }

function opisPaginate(L, rows, lay) {
  var signH = L.sign.gap + 2 * L.sign.line;
  var pages = [];
  var i = 0;
  while (true) {
    var room = L.bottom - (pages.length ? lay.topA : lay.top1) + 1e-6;
    var sum = 0, j = i;
    while (j < rows.length && sum + opisRowHeight(L, lay, rows[j]) <= room) { sum += opisRowHeight(L, lay, rows[j]); j++; }
    if (j === rows.length && sum + signH <= room) { pages.push(rows.slice(i)); break; }
    if (j === rows.length) j--;                          // подписи не влезли — хвост на следующий лист
    while (j - i > 1 && rows[j - 1].group) j--;
    if (j <= i) j = i + 1;
    pages.push(rows.slice(i, j));
    i = j;
  }
  return pages;
}

// Внешний вид текстового поля: перенос (у multiline), центровка по вертикали,
// выравнивание по Q, кегль уменьшается от размера в DA до 6, пока текст не влезет.
function opisFitAppearance(field, maxSize) {
  var P = window.PDFLib;
  var text = String(field.getText() || '').trim();
  var q = field.acroField.dict.get(P.PDFName.of('Q'));
  var align = q ? q.asNumber() : 0;
  var wrap = field.isMultiline();
  return function (f, widget, font) {
    var r = widget.getRectangle(), padX = 1, padY = 0.5;
    var bw = r.width - 2 * padX, bh = r.height - 2 * padY;
    var size = maxSize, lines, lh;
    while (true) {
      lh = size * 1.15;
      lines = wrap
        ? P.layoutMultilineText(text, { alignment: P.TextAlignment.Left, fontSize: size, font: font,
                                        bounds: { x: 0, y: 0, width: bw, height: bh } }).lines
        : [{ encoded: font.encodeText(text), width: font.widthOfTextAtSize(text, size) }];
      var maxW = Math.max.apply(null, lines.map(function (l) { return l.width; }));
      if ((maxW <= bw && (lines.length - 1) * lh + size * 1.1 <= bh) || size <= 6) break;
      size -= 0.5;
    }
    var n = lines.length, cy = r.height / 2;
    var placed = lines.map(function (l, k) {
      var x = align === 1 ? padX + (bw - l.width) / 2 : align === 2 ? padX + bw - l.width : padX;
      return { encoded: l.encoded, x: x, y: cy + ((n - 1) / 2 - k) * lh - 0.33 * size };
    });
    var z = P.degrees(0);
    return [P.beginMarkedContent('Tx'), P.pushGraphicsState(),
            P.rectangle(0, 0, r.width, r.height), P.clip(), P.endPath()]
      .concat(P.drawTextLines(placed, { color: P.rgb(0, 0, 0), font: font.name, size: size, rotate: z, xSkew: z, ySkew: z }))
      .concat([P.popGraphicsState(), P.endMarkedContent()]);
  };
}

// kind: 'copies' | 'edocs'; data.rows: [{group: 'Изделие'} | {inv, designation, ext, signature, sheets, copies}]
function buildOpisPart(kind, data, A) {
  var PDFLib = window.PDFLib, PDFName = PDFLib.PDFName, rgb = PDFLib.rgb;
  var L = A['opis_layout.json'];
  var lay = L[kind];
  return Promise.all([
    PDFLib.PDFDocument.load(A['opis_' + kind + '_1.pdf']),
    PDFLib.PDFDocument.load(A['opis_' + kind + '_1a.pdf'])
  ]).then(function (docs) {
    var pdf = docs[0], tplA = docs[1];
    pdf.registerFontkit(window.fontkit);
    return Promise.all([
      pdf.embedFont(A['times-cp1251.ttf'], { subset: false }),
      pdf.embedFont(A['timesbd-cp1251.ttf'], { subset: false })
    ]).then(function (fonts) {
      var font = fonts[0], bold = fonts[1];
      var form = pdf.getForm();
      var mm = function (v) { return v * L.mm; };
      var sheets = opisPaginate(L, data.rows, lay);
      var total = sheets.length;

      // листы продолжения: поля шаблона 1a переносим с префиксом L{s}_
      var tplFields = tplA.getForm().getFields().map(function (f) {
        var q = f.acroField.dict.get(PDFName.of('Q'));
        return { name: f.getName(), rect: f.acroField.getWidgets()[0].getRectangle(),
                 da: f.acroField.getDefaultAppearance() || '', q: q ? q.asNumber() : 0 };
      });
      var chain = Promise.resolve();
      for (var s = 2; s <= total; s++) {
        (function (s) {
          chain = chain.then(function () { return pdf.copyPages(tplA, [0]); }).then(function (pages) {
            var page = pages[0];
            page.node.delete(PDFName.of('Annots'));
            pdf.addPage(page);
            tplFields.forEach(function (t) {
              var f = form.createTextField('L' + s + '_' + t.name);
              f.addToPage(page, Object.assign({}, t.rect, { borderWidth: 0, borderColor: undefined, backgroundColor: undefined, font: font }));
              f.acroField.setDefaultAppearance(t.da);
              f.acroField.dict.set(PDFName.of('Q'), pdf.context.obj(t.q));
            });
          });
        })(s);
      }
      return chain.then(function () {
        var set = function (n, v) { if (v == null || v === '') return; try { form.getTextField(n).setText(String(v)); } catch (e) {} };
        var pre = function (s) { return s === 1 ? '' : 'L' + s + '_'; };

        // поле поверх ячейки (x, y — левый верх, мм); align: 0 влево, 1 по центру
        var addField = function (page, name, x, y, w, h, value, size, align, multiline) {
          if (size == null) size = L.fontSize;
          if (align == null) align = 1;
          var f = form.createTextField(name);
          f.addToPage(page, { x: mm(x + 0.4), y: page.getHeight() - mm(y + h - 0.3), width: mm(w - 0.8), height: mm(h - 0.6),
                              borderWidth: 0, borderColor: undefined, backgroundColor: undefined, font: font });
          f.acroField.setDefaultAppearance('/TiNR ' + size + ' Tf 0 g');
          f.acroField.dict.set(PDFName.of('Q'), pdf.context.obj(align));
          if (multiline) f.enableMultiline();
          if (value != null && value !== '') f.setText(String(value));
        };
        var line = function (page, x1, y1, x2, y2) {
          page.drawLine({ start: { x: mm(x1), y: page.getHeight() - mm(y1) }, end: { x: mm(x2), y: page.getHeight() - mm(y2) },
                          thickness: 0.5, color: rgb(0, 0, 0) });
        };

        var xs = [L.x0];
        lay.cols.forEach(function (c) { xs.push(xs[xs.length - 1] + c); });
        var n = 0;                                            // сквозной номер строки для имён полей r{n}_*
        sheets.forEach(function (rows, si) {
          var page = pdf.getPage(si);
          var y = si ? lay.topA : lay.top1;
          rows.forEach(function (row) {
            n++;
            var h = opisRowHeight(L, lay, row);
            xs.forEach(function (x) { line(page, x, y, x, y + h); });
            line(page, xs[0], y + h, xs[xs.length - 1], y + h);
            lay.keys.forEach(function (k, j) {
              var v = row.group ? (k === 'designation' ? row.group : '') : row[k];
              addField(page, 'r' + n + '_' + k, xs[j], y, lay.cols[j], h, v, lay.cols[j] > 16 ? L.fontSize : 10, 1, h > L.row);
            });
            y += h;
          });
          if (si === total - 1) {                             // подписи — сразу под таблицей
            y += L.sign.gap;
            L.sign.rows.forEach(function (sr, k) {
              var label = sr[0], who = sr[1];
              var yy = y + k * L.sign.line, ul = yy + L.sign.underline;
              page.drawText(label, { x: mm(L.x0), y: page.getHeight() - mm(yy) - L.fontSize * 0.89, size: L.fontSize, font: font });
              var x1 = L.x0 + font.widthOfTextAtSize('Составил', L.fontSize) / L.mm + 1.5;
              line(page, x1, ul, L.sign.name_to, ul);
              line(page, L.sign.sign[0], ul, L.sign.sign[1], ul);
              line(page, L.sign.date[0], ul, L.sign.date[1], ul);
              addField(page, who + '_name', x1, yy - 0.6, L.sign.name_to - x1, L.sign.line, data[who + 'Name']);
              addField(page, who + '_date', L.sign.date[0], yy - 0.6, L.sign.date[1] - L.sign.date[0], L.sign.line, data[who + 'Date']);
            });
          }
        });

        ['docType', 'company', 'product', 'address', 'topic', 'phone',
         'volumeProduct', 'volumeId', 'volumes', 'owner', 'sizeMb'].forEach(function (k) { set(k, data[k]); });
        set('sheets', total);
        for (var s = 1; s <= total; s++) { set(pre(s) + 'num', data.num); set(pre(s) + 'sheet', s); }

        form.updateFieldAppearances(font);
        form.getFields().forEach(function (f) {
          if (/(^|_)num$/.test(f.getName())) { f.updateAppearances(bold); return; }
          if (!(f instanceof PDFLib.PDFTextField) || !String(f.getText() || '').trim()) return;
          var m = /([\d.]+)\s+Tf/.exec(f.acroField.getDefaultAppearance() || '');
          f.updateAppearances(font, opisFitAppearance(f, m ? +m[1] : L.fontSize));
        });
        form.acroForm.dict.set(PDFName.of('NeedAppearances'), PDFLib.PDFBool.False);
        opisFlattenExcept(form, /(^|_)(address|phone)$|_signature$/);
        return pdf;
      });
    });
  });
}

// «Запекает» поля формы в содержимое листа (как PDFForm.flatten), кроме тех,
// чьё имя подходит под keep, — они остаются редактируемыми. Пустые поля
// просто убираются.
function opisFlattenExcept(form, keep) {
  var PDFLib = window.PDFLib;
  form.getFields().forEach(function (f) {
    if (keep.test(f.getName())) return;
    var filled = !(f instanceof PDFLib.PDFTextField) || String(f.getText() || '').trim();
    var pages = [];
    f.acroField.getWidgets().forEach(function (w) {
      var page = form.findWidgetPage(w);
      if (pages.indexOf(page) === -1) pages.push(page);
      if (!filled) return;
      var key = page.node.newXObject('FlatWidget', form.findWidgetAppearanceRef(f, w));
      var r = w.getRectangle();
      page.pushOperators(PDFLib.pushGraphicsState(), PDFLib.translate(r.x, r.y),
        PDFLib.drawObject(key), PDFLib.popGraphicsState());
    });
    // Не form.removeField: он снимает из /Annots только сам field.ref, и
    // виджеты-Kids остаются висячими ссылками. Удаляем поле сами.
    var refs = [f.ref];
    var kids = f.acroField.normalizedEntries().Kids;
    for (var k = 0; k < kids.size(); k++) {
      if (kids.get(k) instanceof PDFLib.PDFRef) refs.push(kids.get(k));
    }
    refs.forEach(function (ref) { pages.forEach(function (pg) { pg.node.removeAnnot(ref); }); });
    form.acroForm.removeField(f.acroField);
    refs.forEach(function (ref) { form.doc.context.delete(ref); });
  });
}

// Изделие строки документа/извещения — верхний узел Components (имя, как в
// ссылке Product: «ГКВ-10»).
function opisProductName(pid) {
  var root = rootComponent(state.componentsById[pid]);
  return root ? root.name : '';
}

// rows с заголовками групп по изделию; items: [{product, sortKey, row}]
function opisGroupRows(items) {
  var groups = {}, order = [];
  items.forEach(function (it) {
    var g = it.product || '';
    if (!groups[g]) { groups[g] = []; order.push(g); }
    groups[g].push(it);
  });
  order.sort(function (a, b) { return a.localeCompare(b, 'ru', { numeric: true }); });
  var rows = [];
  order.forEach(function (g) {
    if (g) rows.push({ group: g });
    groups[g].sort(function (a, b) { return String(a.sortKey).localeCompare(String(b.sortKey), 'ru', { numeric: true }); })
      .forEach(function (it) { rows.push(it.row); });
  });
  return rows;
}

function gatherOpisData(r) {
  var raw = state.rawById[r.id] || { order: 0, products: [], notices: [], documents: [] };
  var copies = opisGroupRows(raw.notices.map(function (id) {
    var n = state.noticesById[id] || { number: '#' + id, product: '' };
    return { product: n.product, sortKey: (n.date || 0) + ' ' + n.number,
             row: { designation: n.number, sheets: 1, copies: 1 } };
  }));
  var edocs = opisGroupRows(raw.documents.map(function (id) {
    var d = state.docsById[id] || { des: '#' + id, inv: '', sheets: null, version: null, product: 0 };
    return { product: opisProductName(d.product), sortKey: d.inv || d.des,
             row: { inv: d.inv, designation: d.des, ext: d.version != null && d.version !== '' ? d.version + '.pdf' : '',
                    signature: d.signature || '', sheets: d.sheets, copies: 1 } };
  }));
  var products = [];
  copies.concat(edocs).forEach(function (row) { if (row.group && products.indexOf(row.group) === -1) products.push(row.group); });
  if (!products.length) raw.products.forEach(function (pid) {
    var pn = opisProductName(pid);
    if (pn && products.indexOf(pn) === -1) products.push(pn);
  });
  products.sort(function (a, b) { return a.localeCompare(b, 'ru', { numeric: true }); });
  var year = dateToYear(r.IssueDate) || '';
  var product = products.join(' / ');
  // Идентификатор тома: буквенное обозначение изделия (ГКВ, ТГ, МГ, КМГ…) +
  // «№ описи-ГГ», напр. «ГКВ 13-25».
  var letters = [];
  products.forEach(function (p) {
    var m = /^[A-Za-zА-Яа-яЁё]+/.exec(p);
    if (m && letters.indexOf(m[0]) === -1) letters.push(m[0]);
  });
  var volumeNum = (r.Number != null ? r.Number : '') + (year ? '-' + String(year).slice(-2) : '');
  return {
    num: (r.Number != null ? r.Number : '') + (year ? '-' + year : ''),
    volumeId: letters.length ? letters.join('/') + ' ' + volumeNum : volumeNum,
    docType: 'КД',
    company: r.Destination || '',
    address: firmAddress(r.Destination) || r.Address || '',
    product: product,
    volumeProduct: product,
    volumes: 1,
    owner: 'ООО «ЛМП»',
    compiledDate: r.IssueDate ? formatDate(r.IssueDate) : '',
    copies: copies,
    edocs: edocs
  };
}

function buildOpisPdfBytes(data, A) {
  var parts = [];
  if (data.copies.length) parts.push(['copies', data.copies]);
  if (data.edocs.length) parts.push(['edocs', data.edocs]);
  if (!parts.length) return Promise.reject(new Error('В описи нет ни извещений, ни документов — нечего выгружать.'));
  return Promise.all(parts.map(function (p) {
    return buildOpisPart(p[0], Object.assign({}, data, { rows: p[1] }), A);
  })).then(function (pdfs) {
    var PDFLib = window.PDFLib, PDFName = PDFLib.PDFName, PDFRef = PDFLib.PDFRef;
    var out = pdfs[0];
    out.catalog.getOrCreateAcroForm().dict.set(PDFName.of('NeedAppearances'), PDFLib.PDFBool.False);
    if (pdfs.length === 1) return out.save();
    // Склейка: у оставшихся полей второй части (адрес, телефон, сигнатуры) те
    // же имена шаблона, поэтому переименовываем их с префиксом E_, копируем
    // листы вместе с виджетами и регистрируем скопированные поля в AcroForm
    // первой части — они остаются редактируемыми.
    var second = pdfs[1];
    second.getForm().getFields().forEach(function (f) { f.acroField.setPartialName('E_' + f.getName()); });
    return out.copyPages(second, second.getPageIndices()).then(function (pages) {
      var acro = out.getForm().acroForm, seen = {};
      pages.forEach(function (pg) {
        out.addPage(pg);
        var annots = pg.node.Annots();
        if (!annots) return;
        for (var k = 0; k < annots.size(); k++) {
          var ref = annots.get(k);
          var annot = out.context.lookup(ref);
          if (!annot || !annot.get || String(annot.get(PDFName.of('Subtype'))) !== '/Widget') continue;
          var parent = annot.get(PDFName.of('Parent'));
          var fieldRef = parent instanceof PDFRef ? parent : ref;
          if (seen[fieldRef.toString()]) continue;
          seen[fieldRef.toString()] = true;
          acro.addField(fieldRef);
        }
      });
      return out.save();
    });
  });
}

function downloadBytes(bytes, filename) {
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function opisFileName(r) {
  var year = dateToYear(r.IssueDate) || '';
  return 'Опись ' + (r.Number != null ? r.Number : r.id) + (year ? '-' + year : '') + '.pdf';
}

function generateOpisPdf(r, btn) {
  btn.disabled = true; btn.title = 'Генерация…';
  loadOpisAssets().then(function (A) {
    return buildOpisPdfBytes(gatherOpisData(r), A);
  }).then(function (bytes) {
    downloadBytes(bytes, opisFileName(r));
  }).catch(function (err) {
    showError(err);
  }).then(function () {
    btn.disabled = false; btn.title = 'Скачать опись (PDF)';
  });
}

// Одна опись — один PDF.
function buildDownloadCell(r) {
  var td = document.createElement('td');
  td.className = 'reg-dl';
  var wrap = document.createElement('div');
  wrap.className = 'reg-dl-wrap';
  var raw = state.rawById[r.id];
  var has = raw && (raw.notices.length || raw.documents.length);
  var btn = iconButton('dl-btn', pdfSvg(), has ? 'Скачать опись (PDF)' : 'В описи нет извещений и документов');
  btn.disabled = !has;
  btn.addEventListener('click', function () { generateOpisPdf(r, btn); });
  wrap.appendChild(btn);
  td.appendChild(wrap);
  return td;
}
// Столбец редактирования справа — как столбец скачивания слева: узкий,
// кнопки по центру (в режиме правки ✓ над ✕).
function actionCell(btns) {
  var td = document.createElement('td');
  td.className = 'reg-dl';
  var wrap = document.createElement('div');
  wrap.className = 'reg-dl-wrap reg-ed-wrap';
  btns.forEach(function (b) { wrap.appendChild(b); });
  td.appendChild(wrap);
  return td;
}
function downloadSvg() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 21h16"/></svg>'; }
function pdfSvg() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 11h3M9 14h6M9 17h6"/></svg>'; }

function iconButton(cls, svg, title) {
  var btn = document.createElement('button');
  btn.type = 'button'; btn.className = cls; btn.title = title; btn.innerHTML = svg;
  return btn;
}
function pencilSvg() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>'; }
function checkSvg() { return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>'; }
function xSvg() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>'; }

renderRegistry();
</script>
